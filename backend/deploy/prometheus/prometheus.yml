global:
  scrape_interval: 15s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"]
  - job_name: identity
    static_configs:
      - targets: ["identity:9000"]
  - job_name: social
    static_configs:
      - targets: ["social:9001"]
  - job_name: content
    static_configs:
      - targets: ["content:9002"]
  - job_name: feed
    static_configs:
      - targets: ["feed:9003"]
  - job_name: search
    static_configs:
      - targets: ["search:9004"]
  - job_name: messaging
    static_configs:
      - targets: ["messaging:9005"]
  - job_name: realtime
    static_configs:
      - targets: ["realtime:9006"]
  - job_name: calls
    static_configs:
      - targets: ["calls:9007"]
  - job_name: community
    static_configs:
      - targets: ["community:9008"]
  - job_name: notifications
    static_configs:
      - targets: ["notifications:9009"]
